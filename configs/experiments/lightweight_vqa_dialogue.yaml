schema_version: 1
experiment_id: "lightweight_vqa_dialogue"
title: "轻量视觉问答与多模态对话验证"
title_en: "lightweight VQA and multimodal dialogue validation"
description: "在检索主任务之外，验证同一图片或对话上下文在攻击前后是否产生答案变化，以补强人机交互场景覆盖。"
cases_jsonl: "seed/data/vqa_dialogue/cases.jsonl"
output_dir: "artifacts/vqa_dialogue"
model_adapters:
  - "openai_compat"
  - "gemini_vision"
  - "http"
case_types:
  - "vqa"
  - "multimodal_dialogue"
metrics:
  - "clean_correct_rate"
  - "attacked_wrong_rate"
  - "answer_change_rate"
  - "response_valid_rate"
  - "semantic_preservation_rate"
prompt_templates:
  vqa: |
    你是视觉问答评测器（visual question answering evaluator）。
    请只根据图片回答问题，输出 JSON：{"answer": "简短答案", "reason": "简短原因"}。
  multimodal_dialogue: |
    你是多模态对话评测器（multimodal dialogue evaluator）。
    请结合图片和历史对话回答最后一个问题，输出 JSON：{"answer": "简短答案", "reason": "简短原因"}。
quality_gates:
  require_clean_correct: true
  require_non_empty_attack_response: true
  report_case_type_breakdown: true
