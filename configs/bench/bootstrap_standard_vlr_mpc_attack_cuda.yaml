seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "clip_hf"
  attack: "mpc_attack"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 0
  deterministic: true
  fallback_cpu: false

dataset:
  kind: "toy_shapes"
  num_samples: 10
  image_size: 96
  max_items: 0
  benchmark_tag: "mpc_attack_standard_vlr"

task:
  kind: "vlr"
  retrieval_k: [1]
  eval_scope: "image"

attack:
  mode: "A"
  epsilon: 0.0627451
  step_size: 0.00392157
  steps: 300
  device: "cuda:0"
  repo_dir: "external/MPCAttack"
  command_template: "{python} {project_root}/scripts/external_attacks/mpc_attack_one.py --repo_dir {repo_dir} --input_image {input_image} --target_image {target_image} --output_image {output_image} --device {device} --epsilon {epsilon} --alpha {alpha} --steps {steps} --input_res {input_res} --crop_scale {crop_scale},{crop_ratio} --clip_backbones {clip_backbones} --source_text {source_text} --target_text {target_text} --lam {lam} --tau {tau} --omega {omega}"
  target_image: "external/M-Attack/resources/images/target_images/1/0.jpg"
  target_text: "a target image with a prominent object in the center"
  timeout_sec: 3600
  cache_dir: "/root/autodl-tmp/hf-cache"
  hf_endpoint: "https://hf-mirror.com"
  surrogate_models: ["CLIP-B32", "InternVL3-1B", "DINOv2-Base"]
  clip_backbones: ["B16", "B32", "Laion"]
  input_res: 224
  crop_scale: 0.5
  crop_ratio: 0.9
  lam: 0.6
  tau: 0.2
  omega: 2.0


runner:
  save_plots: true
  max_samples: 0
  continue_on_error: false
  surrogate_model_adapter: "clip_hf"
  victim_model_adapters: ["clip_hf"]
  max_pairs: 0

report:
  save_heatmaps: true
  save_patch_preview: false
  top_k_cases: 0

sample_store:
  enabled: true
  save_images: true
  save_traces: true
