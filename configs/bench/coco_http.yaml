# 文件说明：该文件属于实验配置，集中实现 coco http 相关逻辑。
seed: 123
device_preference: "cuda"
artifacts_dir: "artifacts"

plugins:
  model_adapter: "http"
  attack: "tmm"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 2
  deterministic: true
  fallback_cpu: false

model:
  http_endpoint: "http://127.0.0.1:8000/predict"
  http_retries: 2
  http_timeout: 20.0
  enable_gradients: false

dataset:
  kind: "coco_subset"
  root: "data/coco"
  image_dir: "val2017"
  captions_file: "annotations/captions_val2017_subset.json"
  split: "val"
  max_items: 128
  benchmark_tag: "coco_public_subset"

attack:
  mode: "B"
  epsilon: 0.05
  step_size: 0.01
  steps: 10
  patch_size: 16

runner:
  save_plots: true
  max_samples: 128
  continue_on_error: false
