seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "openai_qwen35_9b"
  attack: "advedm_plus"
  defense: "sanitize_v1"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 0
  deterministic: true
  fallback_cpu: false

model:
  clip_model_name: "openai/clip-vit-base-patch32"

dataset:
  kind: "generation_jsonl"
  max_items: 20
  benchmark_tag: "coco_caption_object_val_real"

task:
  kind: "caption"
  eval_scope: "image"
  cases_jsonl: "data/coco2014/generation/coco_caption_object_val.jsonl"
  caption_prompt: "Describe only the visible content of this image in one concise sentence. Mention the main visible objects."
  object_probe_prompt: "Is there a {object_name} in the image? Answer yes or no."
  object_probe_enabled: true

attack:
  mode: "A"
  epsilon: 0.02
  step_size: 0.01
  steps: 2
  patch_size: 16
  topk: 3
  eps_t: 0

defense:
  enabled: false

runner:
  save_plots: true
  max_samples: 20
  continue_on_error: false
  surrogate_model_adapter: "clip_hf"
  victim_model_adapters: ["openai_qwen35_9b"]

report:
  save_heatmaps: true
  save_patch_preview: false
  top_k_cases: 20

sample_store:
  enabled: true
  save_images: true
  save_traces: true
