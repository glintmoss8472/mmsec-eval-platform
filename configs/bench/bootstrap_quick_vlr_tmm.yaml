# 文件说明：该文件属于实验配置，集中实现 bootstrap quick vlr tmm 相关逻辑。
seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "blip_itm"
  attack: "tmm"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 0
  deterministic: true
  fallback_cpu: false

model:
  clip_model_name: "openai/clip-vit-base-patch32"
  blip_itm_model_name: "Salesforce/blip-itm-base-coco"
  vilt_itm_model_name: "dandelin/vilt-b32-finetuned-coco"

dataset:
  kind: "coco_subset"
  root: "data/coco"
  image_dir: "val2017"
  captions_file: "annotations/captions_val2017_subset.json"
  split: "val"
  max_items: 64
  benchmark_tag: "seed_bootstrap_vlr_coco"

task:
  kind: "vlr"
  retrieval_k: [1, 5, 10]
  eval_scope: "joint"

attack:
  mode: "A"
  epsilon: 0.0470588
  step_size: 0.01
  steps: 8
  ratio_r: 0.8
  lambda_att: 0.5
  alpha: 10.0
  eps_t: 1
  text_candidates_k: 12

runner:
  save_plots: true
  max_samples: 0
  continue_on_error: false
  surrogate_model_adapter: "blip_itm"
  victim_model_adapters: ["clip_hf", "blip_itm", "vilt_itm"]
  max_pairs: 25000
