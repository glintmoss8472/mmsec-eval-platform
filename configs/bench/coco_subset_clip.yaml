seed: 123
device_preference: "cuda"
artifacts_dir: "artifacts"

plugins:
  model_adapter: "clip_hf"
  attack: "advclip"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 2
  deterministic: true
  fallback_cpu: false

model:
  clip_model_name: "openai/clip-vit-base-patch32"
  blip_itm_model_name: "Salesforce/blip-itm-base-coco"
  vilt_itm_model_name: "dandelin/vilt-b32-finetuned-coco"
  enable_gradients: true

dataset:
  kind: "coco_subset"
  root: "data/coco"
  image_dir: "val2017"
  captions_file: "annotations/captions_val2017_subset.json"
  split: "val"
  max_items: 5000
  benchmark_tag: "coco_public_subset"

task:
  kind: "vlr"
  retrieval_k: [1, 5, 10]
  eval_scope: "image"

attack:
  mode: "A"
  epsilon: 0.05
  step_size: 0.01
  steps: 10
  patch_size: 16

runner:
  save_plots: true
  max_samples: 5000
  continue_on_error: false
  surrogate_model_adapter: "clip_hf"
  victim_model_adapters: ["clip_hf", "blip_itm", "vilt_itm"]
  max_pairs: 25000000
