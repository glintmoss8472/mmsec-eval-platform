seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "clip_hf"
  attack: "advedm"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: false
  num_workers: 0
  deterministic: true
  fallback_cpu: false

dataset:
  kind: "coco_subset"
  root: "data/coco"
  image_dir: "val2017"
  captions_file: "annotations/captions_val2017_subset.json"
  split: "val"
  max_items: 16
  benchmark_tag: "seed_bootstrap_coco"

attack:
  mode: "A"
  epsilon: 0.04
  step_size: 0.01
  steps: 6
  patch_size: 12

runner:
  save_plots: true
  max_samples: 16
  continue_on_error: false

sample_store:
  enabled: true
  save_images: true
  save_traces: true
