# 文件说明：该文件属于实验配置，集中实现 bootstrap full vlr cuda 相关逻辑。
seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "clip_hf"
  attack: "advclip"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: true
  num_workers: 0
  deterministic: true
  fallback_cpu: false

model:
  clip_model_name: "openai/clip-vit-base-patch32"
  blip_itm_model_name: "Salesforce/blip-itm-base-coco"
  vilt_itm_model_name: "dandelin/vilt-b32-finetuned-coco"
  enable_gradients: true

dataset:
  kind: "coco_subset"
  root: "data/coco"
  image_dir: "val2017"
  captions_file: "annotations/captions_val2017_subset.json"
  split: "val"
  max_items: 5000
  benchmark_tag: "full_vlr_coco"

task:
  kind: "vlr"
  retrieval_k: [1, 5, 10]
  eval_scope: "image"

attack:
  mode: "A"
  epsilon: 0.0470588
  step_size: 0.008
  steps: 16
  patch_size: 32

  # AdvCLIP patch training budget for non-GAN branch.
  patch_train_steps: 900
  topology_k: 5
  lambda_at: 1.0
  lambda_tpd: 1.0
  tau_patch: 0.07
  tv_weight: 0.0003
  nps_weight: 0.0003
  batch_size: 16

runner:
  save_plots: true
  max_samples: 0
  continue_on_error: false
  surrogate_model_adapter: "clip_hf"
  victim_model_adapters: ["clip_hf", "blip_itm", "vilt_itm"]
  max_pairs: 120000

risk:
  scenario: "retrieval"
