seed: 7
artifacts_dir: "artifacts"
device_preference: "cuda"

plugins:
  model_adapter: "clip_hf"
  attack: "anyattack"
  metric: "basic"
  judge: "rule"

runtime:
  device: "cuda"
  amp: true
  num_workers: 0
  deterministic: true
  fallback_cpu: false

model:
  clip_model_name: "openai/clip-vit-base-patch32"

dataset:
  kind: "toy_shapes"
  num_samples: 10
  image_size: 96
  max_items: 0
  benchmark_tag: "anyattack_standard_vlr"

task:
  kind: "vlr"
  retrieval_k: [1]
  eval_scope: "image"

attack:
  mode: "A"
  epsilon: 0.0627451
  step_size: 0.01
  steps: 1
  repo_dir: "external/AnyAttack"
  command_template: "{python} {project_root}/scripts/external_attacks/anyattack_demo_one.py --repo_dir {repo_dir} --input_image {input_image} --target_image {target_image} --decoder_path {decoder_path} --output_image {output_image} --device {device} --epsilon {epsilon}"
  target_image: "external/AnyAttack/example.jpg"
  target_text: ""
  timeout_sec: 900
  decoder_path: "external/AnyAttack/checkpoints/coco_cos.pt"
  hf_endpoint: "https://hf-mirror.com"

runner:
  save_plots: true
  max_samples: 0
  continue_on_error: false
  surrogate_model_adapter: "clip_hf"
  victim_model_adapters: ["clip_hf"]
  max_pairs: 0

report:
  save_heatmaps: true
  save_patch_preview: false
  top_k_cases: 0

sample_store:
  enabled: true
  save_images: true
  save_traces: true
