# 文件说明：该文件属于项目工程，集中实现 pyproject 相关逻辑。
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsec-eval-platform"
version = "0.1.0"
description = "Multimodal AI adversarial security evaluation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "matplotlib>=3.7",
    "streamlit>=1.30",
    "requests>=2.31",
    "torch>=2.1",
    "transformers>=4.35",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
