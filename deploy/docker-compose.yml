services:
  mmsec-eval-platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        INSTALL_CUDA_TORCH: ${INSTALL_CUDA_TORCH:-0}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu126}
    image: mmsec-eval-platform:latest
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: 8000
      MMSEC_BOOTSTRAP_ENABLED: ${MMSEC_BOOTSTRAP_ENABLED:-1}
      MMSEC_ARTIFACTS_DIR: /app/artifacts
      MMSEC_APP_DB: /app/artifacts/app.db
      MMSEC_HF_LOCAL_ONLY: ${MMSEC_HF_LOCAL_ONLY:-1}
      HF_HOME: /app/.hf-cache
      TRANSFORMERS_CACHE: /app/.hf-cache/transformers
      HF_DATASETS_CACHE: /app/.hf-cache/datasets
      HF_HUB_DISABLE_XET: 1
      NO_PROXY: 127.0.0.1,localhost
      no_proxy: 127.0.0.1,localhost
    volumes:
      - mmsec_artifacts:/app/artifacts
      - mmsec_hf_cache:/app/.hf-cache
      - mmsec_data:/app/data
    # Uncomment when the host has NVIDIA Container Toolkit configured.
    # gpus: all

volumes:
  mmsec_artifacts:
  mmsec_hf_cache:
  mmsec_data:
